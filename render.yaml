services:
  # ── Production ──────────────────────────────────────────────────────────────
  - type: web
    name: backend-mail-prod
    runtime: python
    rootDir: backend_mail
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 8 --worker-connections 200
    branch: master
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      # Les secrets suivants sont à définir manuellement dans Render Dashboard :
      # DATABASE_URL, SMTP_EMAIL, SMTP_PASSWORD, JWT_SECRET_KEY,
      # GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET, FIREBASE_CREDENTIALS_JSON,
      # SENTRY_DSN, RENDER_EXTERNAL_URL

  # ── Staging ─────────────────────────────────────────────────────────────────
  - type: web
    name: backend-mail-staging
    runtime: python
    rootDir: backend_mail
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4 --worker-connections 100
    branch: staging
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: PYTHON_VERSION
        value: 3.11.0
      # Mêmes secrets que prod — pointer vers une DB de staging séparée (DATABASE_URL)
      # SENTRY_DSN peut être le même projet Sentry avec environment=staging
